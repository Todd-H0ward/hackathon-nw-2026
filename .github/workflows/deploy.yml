name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  FRONTEND_IMAGE: ghcr.io/todd-h0ward/hackathon-nw-2026/frontend

jobs:
  # ──────────────────────────────────────────────
  # Frontend: Build → Docker Image → Push GHCR
  # ──────────────────────────────────────────────
  frontend-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend
        run: pnpm run build

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

  # ──────────────────────────────────────────────
  # Frontend: Deploy to VPS via SSH
  # ──────────────────────────────────────────────
  frontend-deploy:
    needs: frontend-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p /opt/nwstep/frontend
            cd /opt/nwstep/frontend
            docker pull ${{ env.FRONTEND_IMAGE }}:latest
            docker stop nwstep-frontend || true
            docker rm nwstep-frontend || true
            docker run -d --name nwstep-frontend -p 80:80 --add-host=host.docker.internal:host-gateway --restart always ${{ env.FRONTEND_IMAGE }}:latest
            docker image prune -f
